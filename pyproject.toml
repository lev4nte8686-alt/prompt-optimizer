[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimizer"
version = "0.1.0"
description = "A tool to optimize prompts for better LLM performance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
web = ["streamlit>=1.28.0"]
dev = ["pytest>=7.0"]

[project.scripts]
prompt-optimizer = "prompt_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["prompt_optimizer*"]
